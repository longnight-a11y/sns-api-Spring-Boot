services:
  postgres:
    image: postgres:17

    container_name: snsapi-db

    environment:
      POSTGRES_DB: snsapi-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: posgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: