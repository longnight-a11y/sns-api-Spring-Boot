services:

  app:
    build: .
    container_name: snsapi-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:17

    container_name: snsapi-db

    environment:
      POSTGRES_DB: snsapi-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d snsapi-db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: